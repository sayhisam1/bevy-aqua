[workspace]
members = ["crates/bevy-aqua-fft", "crates/bevy-aqua-sdf", "crates/bevy-aqua-geom", "crates/bevy-aqua-light", "crates/bevy-aqua-optics", "crates/bevy-aqua-core", "crates/bevy-aqua-waves", "crates/bevy-aqua-foam", "crates/bevy-aqua-shore", "crates/bevy-aqua-query", "crates/bevy-aqua-reflect", "crates/bevy-aqua-spray", "crates/bevy-aqua-motion", "crates/bevy-aqua-volume"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sayhisam1/bevy-aqua"

[workspace.dependencies]
bevy-aqua-core = { path = "crates/bevy-aqua-core", version = "0.1.3" }
bevy-aqua-fft = { path = "crates/bevy-aqua-fft", version = "0.1.3" }
bevy-aqua-foam = { path = "crates/bevy-aqua-foam", version = "0.1.3" }
bevy-aqua-geom = { path = "crates/bevy-aqua-geom", version = "0.1.3" }
bevy-aqua-light = { path = "crates/bevy-aqua-light", version = "0.1.3" }
bevy-aqua-optics = { path = "crates/bevy-aqua-optics", version = "0.1.3" }
bevy-aqua-motion = { path = "crates/bevy-aqua-motion", version = "0.1.3" }
bevy-aqua-query = { path = "crates/bevy-aqua-query", version = "0.1.3" }
bevy-aqua-reflect = { path = "crates/bevy-aqua-reflect", version = "0.1.3" }
bevy-aqua-sdf = { path = "crates/bevy-aqua-sdf", version = "0.1.3" }
bevy-aqua-spray = { path = "crates/bevy-aqua-spray", version = "0.1.3" }
bevy-aqua-shore = { path = "crates/bevy-aqua-shore", version = "0.1.3" }
bevy-aqua-waves = { path = "crates/bevy-aqua-waves", version = "0.1.3" }
bevy-aqua-volume = { path = "crates/bevy-aqua-volume", version = "0.1.3" }
bevy = { version = "0.19", default-features = false }
bevy_ecs = "0.19"
bevy_hanabi = { version = "0.19.0", default-features = false, features = ["3d"] }
glam = "0.32"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[package]
name = "bevy-aqua"
description = "Camera-centred ocean rendering for Bevy with Gerstner and FFT waves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/bevy-aqua"
keywords = ["bevy", "water", "ocean", "shader"]
categories = ["game-development", "rendering"]
exclude = ["assets/test/**"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["query", "reflect"]
query = ["dep:bevy-aqua-query"]
reflect = ["dep:bevy-aqua-reflect"]
motion = ["dep:bevy-aqua-motion"]
spray = ["dep:bevy-aqua-spray", "query"]

[dependencies]
bevy-aqua-core.workspace = true
bevy-aqua-foam.workspace = true
bevy-aqua-motion = { workspace = true, optional = true }
bevy-aqua-waves.workspace = true
bevy-aqua-query = { workspace = true, optional = true }
bevy-aqua-reflect = { workspace = true, optional = true }
bevy-aqua-spray = { workspace = true, optional = true }
bevy-aqua-shore.workspace = true
bevy-aqua-volume.workspace = true
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_pbr",
    "bevy_render",
    "bevy_core_pipeline",
] }

[dev-dependencies]
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "reflect_auto_register",
    "tonemapping_luts",
    "x11",
    "zstd_rust",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
bevy = { workspace = true, features = ["webgpu"] }

[[example]]
name = "planar_reflection"
required-features = ["reflect"]

[[example]]
name = "wave_query"
required-features = ["query"]

[lints]
workspace = true

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
